# ===== SVJob – cấu hình chạy local =====
# Khi deploy (buổi 9) chỉ cần khai báo biến môi trường DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, CORS_ORIGIN
server.port=${PORT:8080}

# Mỗi máy có mật khẩu MySQL riêng: tạo file backend/db.properties (chép từ db.properties.example) và ghi
# DB_PASSWORD=<mật khẩu MySQL của máy mình>. File này không đưa lên Git. Không có file thì dùng giá trị mặc định bên dưới.
spring.config.import=optional:file:./db.properties,optional:file:./backend/db.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/svjob?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Svjob@2026}

# Bảng được tạo bằng database/schema.sql nên Hibernate không tự sửa cấu trúc
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Cho phép gửi tới 10 MB để backend tự báo lỗi "File tối đa 5 MB" (FR-04)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

app.jwt.secret=${JWT_SECRET:svjob-nhom4-khoa-bi-mat-dung-cho-moi-truong-dev-it-nhat-32-ky-tu}
app.jwt.expiration-minutes=60
app.upload-dir=${UPLOAD_DIR:uploads}
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}
